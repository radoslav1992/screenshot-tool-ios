name: EasyCapture
options:
  bundleIdPrefix: com.easyscreencapture
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    APP_GROUP_IDENTIFIER: group.com.easyscreencapture.ios
    CODE_SIGN_STYLE: Automatic
targets:
  EasyCapture:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easyscreencapture.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        APNS_ENVIRONMENT: development
      configs:
        Release:
          APNS_ENVIRONMENT: production
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Easy Capture
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSPhotoLibraryAddUsageDescription: Save the website screenshots you choose to your photo library.
        CFBundleURLTypes:
          - CFBundleURLName: com.easyscreencapture.ios
            CFBundleURLSchemes: [easycapture]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: CaptureShare
        embed: true
  CaptureShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easyscreencapture.ios.share
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/ShareInfo.plist
      properties:
        CFBundleDisplayName: Easy Capture
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
  EasyCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EasyCapture
  EasyCaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EasyCapture
schemes:
  EasyCapture:
    build:
      targets:
        EasyCapture: all
        CaptureShare: all
    run:
      config: Debug
      executable: EasyCapture
      askForAppToLaunch: false
    profile:
      config: Release
      executable: EasyCapture
      askForAppToLaunch: false
    test:
      targets: [EasyCaptureTests, EasyCaptureUITests]
